<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#F8FAFC" rx="12" />

  <!-- Header -->
  <text x="450" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0F172A">
    Automated Resume Screening Tool — System Architecture
  </text>
  <text x="450" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" fill="#64748B">
    End-to-End NLP Feature Extraction, Cosine Similarity &amp; Explainable ATS Scoring
  </text>

  <!-- Stage 1: Ingestion -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="180" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect width="180" height="32" rx="8" fill="url(#blueGrad)" />
    <text x="90" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. INGESTION</text>
    <text x="90" y="55" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• PDF (PyPDF2)</text>
    <text x="90" y="75" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• DOCX (python-docx)</text>
    <text x="90" y="95" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• TXT &amp; LinkedIn text</text>
    <text x="90" y="115" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• PII Segregation</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 220 175 L 260 175" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 2: Normalization & NLP -->
  <g transform="translate(260, 110)" filter="url(#shadow)">
    <rect width="180" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect width="180" height="32" rx="8" fill="url(#blueGrad)" />
    <text x="90" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. NLP &amp; EXTRACTION</text>
    <text x="90" y="55" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Regex Cleaning</text>
    <text x="90" y="75" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Taxonomy Mapping</text>
    <text x="90" y="95" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• RapidFuzz Token-Sort</text>
    <text x="90" y="115" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Exp &amp; Degree Parser</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 440 175 L 480 175" stroke="#94A3B8" stroke-width="3" fill="none" />

  <!-- Stage 3: TF-IDF & Scoring Engine -->
  <g transform="translate(480, 110)" filter="url(#shadow)">
    <rect width="180" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect width="180" height="32" rx="8" fill="url(#blueGrad)" />
    <text x="90" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. SCORING ENGINE</text>
    <text x="90" y="55" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• TF-IDF 1,2-ngrams</text>
    <text x="90" y="75" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Cosine Similarity (35%)</text>
    <text x="90" y="95" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Must-Have Match (50%)</text>
    <text x="90" y="115" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Exp Gate &amp; Gap Penalty</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 660 175 L 700 175" stroke="#94A3B8" stroke-width="3" fill="none" />

  <!-- Stage 4: Decision & Outputs -->
  <g transform="translate(700, 110)" filter="url(#shadow)">
    <rect width="160" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect width="160" height="32" rx="8" fill="url(#emeraldGrad)" />
    <text x="80" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. AUDIT &amp; RANK</text>
    <text x="80" y="55" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Shortlisted (&gt;=65%)</text>
    <text x="80" y="75" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Under Review</text>
    <text x="80" y="95" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Disqualified / Reject</text>
    <text x="80" y="115" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Recruiter Rationale</text>
  </g>

  <!-- Bottom Delivery Channels Box -->
  <g transform="translate(40, 280)" filter="url(#shadow)">
    <rect width="820" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="410" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">
      DELIVERY CHANNELS &amp; RECRUITER INTERFACES
    </text>

    <!-- Channel 1: Terminal CLI -->
    <rect x="30" y="50" width="220" height="80" rx="6" fill="#F1F5F9" />
    <text x="140" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">💻 Terminal CLI</text>
    <text x="140" y="95" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">python main.py</text>
    <text x="140" y="115" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Console table &amp; CSV export</text>

    <!-- Channel 2: Streamlit Dashboard -->
    <rect x="290" y="50" width="240" height="80" rx="6" fill="#F1F5F9" />
    <text x="410" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">📊 Streamlit Dashboard</text>
    <text x="410" y="95" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">streamlit run app_streamlit.py</text>
    <text x="410" y="115" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Drag-and-drop &amp; visual gap cards</text>

    <!-- Channel 3: Next.js + FastAPI -->
    <rect x="570" y="50" width="220" height="80" rx="6" fill="#F1F5F9" />
    <text x="680" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">⚡ Next.js + FastAPI</text>
    <text x="680" y="95" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">apps/web &amp; api/app.py</text>
    <text x="680" y="115" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">RESTful API &amp; React portal</text>
  </g>
</svg>
